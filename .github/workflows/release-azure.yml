# Build the full BaseX release set via build.xq and sign the Windows installer
# with Azure Artifact Signing (formerly Trusted Signing). Authenticates to Azure
# via OIDC (no client secret). Needs these six values, each as a repository secret or variable (secret wins):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  (federated credential
#   for this repo; the app needs role "Artifact Signing Certificate Profile Signer")
#   AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE
# Without AZURE_CLIENT_ID, signing is skipped.

name: Build and sign release (Azure)

on:
  workflow_dispatch:
    inputs:
      basex-ref:
        description: "Branch/tag/SHA of BaseXdb/basex to build against"
        required: false
        default: main

permissions:
  contents: read
  id-token: write   # OIDC token for azure/login

jobs:
  build-release:
    runs-on: windows-latest

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT || vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT || vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE || vars.AZURE_SIGNING_PROFILE }}
      HAS_AZURE_SIGNING: ${{ (secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID) != '' }}

    steps:
      - name: Checkout basex-dist
        uses: actions/checkout@v7
        with:
          path: basex-dist

      # basex must sit next to basex-dist (modules/release.xqm references ../basex)
      - name: Checkout basex
        uses: actions/checkout@v7
        with:
          repository: BaseXdb/basex
          ref: ${{ inputs.basex-ref }}
          path: basex

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # build.xq is run by BaseX itself
      - name: Compile BaseX
        shell: cmd
        working-directory: basex
        run: mvn -q -pl basex-core compile

      - name: Build all release artifacts
        shell: cmd
        working-directory: basex-dist
        run: java -cp ../basex/basex-core/target/classes org.basex.BaseX build.xq

      - name: Azure login (OIDC)
        if: env.HAS_AZURE_SIGNING == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # Signs the installer in place
      - name: Sign installer with Azure Artifact Signing
        if: env.HAS_AZURE_SIGNING == 'true'
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ env.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\basex-dist\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify installer signature
        if: env.HAS_AZURE_SIGNING == 'true'
        shell: pwsh
        run: |
          Get-ChildItem basex-dist/release/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            "$($_.Name)"
            "Status : $($sig.Status)"
            "Signer : $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "Invalid signature on $($_.Name)" }
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: BaseX-release
          path: basex-dist/release/
          if-no-files-found: error
